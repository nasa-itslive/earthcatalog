name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install project and test dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --extra dev

      - name: Run tests (unit)
        run: |
          source .venv/bin/activate
          # Hermetic PR gate: integration/e2e tests hit real S3 and are run
          # on demand (workflow dispatch or locally), not on every PR.
          pytest --tb=short -q -m "not integration and not performance and not e2e"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: .pytest_cache/
  wheel-smoke:
    name: wheel install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Build sdist and wheel
        run: uv build

      - name: Install wheel into a fresh venv (no source tree)
        run: |
          uv venv smoke
          source smoke/bin/activate
          uv pip install dist/*.whl

      - name: CLI must work from the wheel alone
        run: |
          source smoke/bin/activate
          earthcatalog --help
          earthcatalog ingest --help
          earthcatalog diff --help
          earthcatalog info --help
          python -c "import earthcatalog, earthcatalog.diff, earthcatalog.journal; print('imports ok')"
