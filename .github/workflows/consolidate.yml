# Daily maintenance (after the daily ingest slot): merges small part files
# into one file per (tile, temporal bin) partition with a single atomic
# Iceberg transaction per partition.  Each run is bounded by --limit-tiles
# (biggest offenders first) so it comfortably fits the 120-minute runner
# timeout; the CLI holds the catalog lock, publishes the catalog every
# --flush-every partitions, and deletes old objects only after the publish
# that registered their replacement.
name: Consolidate

on:
  schedule:
    # Daily, 08:13 UTC — before the daily ingest (14:07 UTC), off the hour
    # to avoid the top-of-the-hour scheduler congestion that delays GitHub
    # cron runs by hours at peak.
    - cron: "13 8 * * *"
  workflow_dispatch:
    inputs:
      min_files:
        description: "Consolidate partitions holding at least this many files"
        required: false
        default: "4"
      limit_tiles:
        description: "Cap partitions per run (biggest offenders first; 0 = all)"
        required: false
        default: "300"
      flush_every:
        description: "Publish the catalog + delete old objects every N partitions"
        required: false
        default: "25"
      dry_run:
        description: "Report consolidation targets without writing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: earthcatalog-consolidate
  cancel-in-progress: false

env:
  AWS_REGION:        us-west-2
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  WAREHOUSE:         s3://its-live-data/test-space/stac/catalog/warehouse
  CATALOG_KEY:       test-space/stac/catalog/earthcatalog.db
  LOCK_KEY:          test-space/stac/catalog/.lock

jobs:
  consolidate:
    name: Consolidate warehouse partitions
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install earthcatalog
        run: uv sync

      - name: Resolve flags
        id: flags
        run: |
          ARGS="--min-files ${{ github.event.inputs.min_files || '4' }}"
          ARGS="$ARGS --flush-every ${{ github.event.inputs.flush_every || '25' }}"
          LIMIT="${{ github.event.inputs.limit_tiles || '300' }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit-tiles $LIMIT"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Download catalog
        run: |
          uv run python -c "
          from obstore.store import S3Store
          from earthcatalog import store_config
          from earthcatalog.catalog import download_catalog

          store = S3Store(bucket='its-live-data', region='us-west-2')
          store_config.set_store(store)
          store_config.set_catalog_key('${{ env.CATALOG_KEY }}')
          download_catalog('/tmp/earthcatalog.db')
          "

      - name: Catalog info (before)
        run: |
          uv run earthcatalog info \
            --catalog   /tmp/earthcatalog.db \
            --warehouse ${{ env.WAREHOUSE }} || true

      - name: Consolidate
        env:
          EARTHCATALOG_CATALOG_KEY: ${{ env.CATALOG_KEY }}
          EARTHCATALOG_LOCK_KEY: ${{ env.LOCK_KEY }}
        run: |
          uv run earthcatalog consolidate \
            --catalog   /tmp/earthcatalog.db \
            --warehouse ${{ env.WAREHOUSE }} \
            --lock-key  ${{ env.LOCK_KEY }} \
            ${{ steps.flags.outputs.args }}

      - name: Catalog info (after)
        if: always()
        run: |
          uv run earthcatalog info \
            --catalog   /tmp/earthcatalog.db \
            --warehouse ${{ env.WAREHOUSE }} || true

      - name: Summary
        if: always()
        run: |
          echo "### Consolidation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Min files: \`${{ github.event.inputs.min_files || '4' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Limit tiles: \`${{ github.event.inputs.limit_tiles || '300' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Flush every: \`${{ github.event.inputs.flush_every || '25' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run: \`${{ github.event.inputs.dry_run || 'false' }}\`" >> "$GITHUB_STEP_SUMMARY"
