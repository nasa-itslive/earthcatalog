# Weekly maintenance, run AFTER garbage collection: merges small part
# files into one file per (tile, temporal bin) partition with a single
# atomic Iceberg transaction per partition.  Dispatch-only — no schedule.
name: Consolidate

on:
  schedule:
    # Sundays 08:00 UTC — after the weekend garbage-collection slot.
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      min_files:
        description: "Consolidate partitions holding at least this many files"
        required: false
        default: "4"
      limit_tiles:
        description: "Cap partitions per run (biggest offenders first; empty = all)"
        required: false
        default: ""
      dry_run:
        description: "Report consolidation targets without writing"
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION:        us-west-2
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  WAREHOUSE:         s3://its-live-data/test-space/stac/catalog/warehouse
  CATALOG_KEY:       test-space/stac/catalog/earthcatalog.db

jobs:
  consolidate:
    name: Consolidate warehouse partitions
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install earthcatalog
        run: uv sync

      - name: Resolve flags
        id: flags
        run: |
          ARGS="--min-files ${{ github.event.inputs.min_files || '4' }}"
          if [ -n "${{ github.event.inputs.limit_tiles }}" ]; then
            ARGS="$ARGS --limit-tiles ${{ github.event.inputs.limit_tiles }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Catalog info (before)
        run: |
          uv run python scripts/info.py \
            --catalog   /tmp/earthcatalog.db \
            --warehouse ${{ env.WAREHOUSE }} || true

      - name: Consolidate
        env:
          EARTHCATALOG_CATALOG_KEY: ${{ env.CATALOG_KEY }}
        run: |
          uv run earthcatalog consolidate \
            --catalog   /tmp/earthcatalog.db \
            --warehouse ${{ env.WAREHOUSE }} \
            ${{ steps.flags.outputs.args }}

      - name: Catalog info (after)
        if: always()
        run: |
          uv run python scripts/info.py \
            --catalog   /tmp/earthcatalog.db \
            --warehouse ${{ env.WAREHOUSE }} || true

      - name: Summary
        if: always()
        run: |
          echo "### Consolidation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Min files: \`${{ github.event.inputs.min_files || '4' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Limit tiles: \`${{ github.event.inputs.limit_tiles || 'all' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run: \`${{ github.event.inputs.dry_run || 'false' }}\`" >> "$GITHUB_STEP_SUMMARY"
