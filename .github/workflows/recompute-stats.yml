# One-shot maintenance: recompute the catalog-stats snapshot from the index.
#
# The historical snapshot counted index rows (fan-out: an item spanning
# several H3 tiles is one row per cell) instead of distinct items, so
# "Items per day" was inflated.  `compute_full` now counts distinct s3_key;
# this workflow runs the expensive recompute once and (optionally) persists
# it.  Read-only unless update=true.  It writes only stats.json — never the
# warehouse or the catalog db.
name: Recompute stats

on:
  workflow_dispatch:
    inputs:
      update:
        description: "Persist the recomputed snapshot (otherwise report drift only)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  WAREHOUSE: s3://its-live-data/test-space/stac/catalog/warehouse
  CATALOG_KEY: test-space/stac/catalog/earthcatalog.db

jobs:
  recompute:
    name: Recompute catalog stats
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install earthcatalog
        run: uv sync

      - name: Download catalog
        run: |
          uv run python -c "
          from obstore.store import S3Store
          from earthcatalog import store_config
          from earthcatalog.catalog import download_catalog

          store = S3Store(bucket='its-live-data', region='us-west-2')
          store_config.set_store(store)
          store_config.set_catalog_key('${{ env.CATALOG_KEY }}')
          download_catalog('/tmp/earthcatalog.db')
          "

      - name: Recompute
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.update }}" = "true" ]; then ARGS="--update"; fi
          uv run earthcatalog info \
            --catalog   /tmp/earthcatalog.db \
            --warehouse "${{ env.WAREHOUSE }}" \
            --verify \
            $ARGS
