[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "earthcatalog"
dynamic = ["version"]
description = "Spatially-partitioned STAC ingest pipeline backed by Apache Iceberg"
requires-python = ">=3.12"
dependencies = [
  "pyarrow",
  "pyiceberg[pyiceberg-core,sql-sqlite]",
  "obstore",
  "rustac[arrow]",
  "cql2",
  "pystac",
  "h3",
  "shapely",
  "numpy",
  "pyyaml",
  "typer",
  "dask[distributed]",
  "bokeh>=3.1.0",
  "orjson",
  "xxhash",
  "duckdb",
  "pybloom-live",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pandas",
  "coiled",
  "jupyterlab",
  "dask-labextension",
  "pytest",
  "pytest-asyncio",
  "pytest-xdist",
  "ruff",
  "mypy",
  "pre-commit",
  "zensical",
  "mkdocstrings[python]",
  "scalene",
  "memray",
]

[project.urls]
Homepage = "https://github.com/nasa-itslive/earthcatalog"
Repository = "https://github.com/nasa-itslive/earthcatalog"
Documentation = "https://nasa-itslive.github.io/earthcatalog/"
"Bug Tracker" = "https://github.com/nasa-itslive/earthcatalog/issues"
Changelog = "https://github.com/nasa-itslive/earthcatalog/blob/main/CHANGELOG.md"

[project.scripts]
earthcatalog-ingest = "earthcatalog.pipelines.incremental:main"
earthcatalog = "earthcatalog.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["earthcatalog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests that require real S3 read access (public ITS_LIVE bucket)",
  "e2e: heavy pipeline tests skipped in pre-commit (run with pytest -m e2e)",
  "performance: latency benchmarks against real S3 catalog",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501"]                   # line length enforced by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
