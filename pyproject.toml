[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "earthcatalog"
dynamic = ["version"]
description = "Spatially-partitioned STAC ingest pipeline backed by Apache Iceberg"
requires-python = ">=3.12"
dependencies = [
  "pyarrow",
  "pyiceberg[pyiceberg-core,sql-sqlite]",
  "obstore",
  "rustac[arrow]",
  "cql2",
  "pystac",
  "h3",
  "shapely",
  "numpy",
  "pyyaml",
  "typer",
  "dask[distributed]",
  "orjson",
  "xxhash",
  "duckdb",
  "pybloom-live",
  "tqdm",
  "pyproj>=3.7.2",
  "s2geometry>=0.14.0",
]

[project.optional-dependencies]
dev = [
  "pandas",
  "coiled",
  "bokeh",
  "jupyterlab",
  "dask-labextension",
  "pytest",
  "pytest-asyncio",
  "pytest-xdist",
  "ruff",
  "mypy",
  "pre-commit",
  "zensical",
  "mkdocstrings[python]",
  "scalene",
  "memray",
  "pandas-stubs",
  "types-pyyaml",
  "types-shapely",
]

[project.urls]
Homepage = "https://github.com/nasa-itslive/earthcatalog"
Repository = "https://github.com/nasa-itslive/earthcatalog"
Documentation = "https://nasa-itslive.github.io/earthcatalog/"
"Bug Tracker" = "https://github.com/nasa-itslive/earthcatalog/issues"
Changelog = "https://github.com/nasa-itslive/earthcatalog/blob/main/CHANGELOG.md"

[project.scripts]
earthcatalog = "earthcatalog.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["earthcatalog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests that require real S3 read access (public ITS_LIVE bucket)",
  "e2e: heavy pipeline tests skipped in pre-commit (run with pytest -m e2e)",
  "performance: latency benchmarks against real S3 catalog",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501"]                   # line length enforced by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
# Third-party libs without py.typed markers — runtime-verified, stub-less.
module = [
  "shapely.*",
  "shapely",
  "shapely.geometry",
  "shapely.strtree",
  "yaml",
  "pandas.*",
  "tqdm.*",
  "h3.*",
  "s2geometry.*",
  "pybloom_live.*",
  "coiled.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The pyarrow.compute re-export shim: pyarrow's partial stubs make every
# name here a mypy false positive.  Runtime-verified via the test suite.
module = ["earthcatalog._pcc"]
ignore_errors = true

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"

[dependency-groups]
dev = [
    "pandas",
    "coiled",
    "bokeh",
    "jupyterlab",
    "dask-labextension",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "ruff",
    "mypy",
    "pre-commit",
    "zensical",
    "mkdocstrings[python]",
    "scalene",
    "memray",
    "pandas-stubs>=3.0.5.260730",
    "types-pyyaml",
    "types-shapely>=2.1.0.20260728",
]
